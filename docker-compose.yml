version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neha_postgres
    environment:
      POSTGRES_USER: neha
      POSTGRES_PASSWORD: neha_secret
      POSTGRES_DB: neha_institute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
